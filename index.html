<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="C语言400道选择题在线刷题：单题/逐题模式、选项乱序、模拟测试答题卡、错题本、进度本地保存，纯离线单文件。">
<meta name="theme-color" content="#0f1420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c8dff'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' font-weight='bold' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<title>C语言400道选择题 刷题</title>
<style>
:root{--bg:#0f1420;--card:#1a2130;--line:#2a3446;--fg:#e6edf5;--mut:#8b9bb4;
--blue:#4c8dff;--green:#2ecc71;--red:#ff5c5c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:rgba(15,20,32,.95);
backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
h1{margin:0 0 6px;font-size:18px;font-weight:600}
h1 span{color:var(--blue)}
.progresswrap{height:6px;background:#222c3d;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.pbar{height:100%;width:0;background:linear-gradient(90deg,#4c8dff,#2ecc71);transition:width .25s}
.stats{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.bar .kwbtn{display:none}
select,input{background:var(--card);color:var(--fg);border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
input{min-width:180px;flex:1}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;
padding:7px 14px;font-size:13px;cursor:pointer}
button.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg)}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:not-allowed}
.testbar{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mut)}
main{max-width:920px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:16px 18px;margin-bottom:14px}
.card.result{border-color:var(--blue);box-shadow:0 0 0 1px rgba(76,141,255,.3)}
.card.result .big{font-size:26px;font-weight:700;color:var(--blue);margin:6px 0}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
padding:0 6px;background:#243349;color:#9fc0ff;border-radius:7px;font-size:12px;line-height:1}
.icog{display:flex;align-items:center;gap:8px;margin-left:auto}
.ibtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
padding:0;background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--mut)}
.ibtn svg{width:15px;height:15px;display:block}
.ibtn:hover:not(:disabled){border-color:var(--blue);color:var(--fg)}
.ibtn.on{color:var(--blue);border-color:rgba(76,141,255,.55)}
.ibtn[data-lib].on{color:var(--green);border-color:rgba(46,204,113,.5)}
.ok{border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 8px;font-size:12px}
.bad{border:1px solid rgba(255,92,92,.42);color:#e39b9b;border-radius:6px;padding:1px 8px;font-size:12px}
.sel{background:rgba(76,141,255,.16);color:#9fc0ff;border-radius:6px;padding:2px 8px}
.q{white-space:pre-wrap;word-break:break-word;font-size:15px}
.opts{margin-top:12px;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
background:#141b28;border-radius:9px;padding:9px 12px;cursor:pointer;
transition:.15s;font-size:14px;white-space:pre-wrap}
.opt:hover{border-color:var(--blue)}
.opt .k{font-weight:700;color:var(--blue);flex:0 0 18px}
.opt>span{min-width:0;overflow-wrap:anywhere}
.opt.correct{background:rgba(46,204,113,.14);border-color:var(--green)}
.opt.wrong{background:rgba(255,92,92,.14);border-color:var(--red)}
.opt.sel{background:rgba(76,141,255,.14);border-color:var(--blue)}
.ans{margin-top:12px;padding:12px 14px;border-left:3px solid var(--green);
background:rgba(46,204,113,.07);border-radius:0 9px 9px 0;font-size:14px;
white-space:pre-wrap;display:none}
.ans.show{display:block}
.ans b{color:var(--fg)}
.act{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.act button{font-size:12px;padding:6px 12px}
.mut{color:var(--mut);font-size:13px}
.empty{color:var(--mut);text-align:center;padding:40px}

/* ===== 追加功能样式 ===== */
.stem{overflow-x:auto}
pre.code{font-family:ui-monospace,Consolas,"Cascadia Mono","Courier New",monospace;font-size:13px;
background:#0b101a;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0;
white-space:pre;overflow-x:auto;line-height:1.55;tab-size:2}
.ans pre.code{margin:8px 0}
.ansL{font-weight:700}
.card.sheet{margin-bottom:12px}
.shead{font-size:13px;color:var(--mut);margin-bottom:9px}
.sgrid{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#121a28;
color:var(--mut);font-size:13px;cursor:pointer;padding:0}
.sbtn.done{background:#1e3a5f;color:#9fc0ff;border-color:#2f5a8f}
.sbtn.cur{outline:2px solid var(--blue);color:var(--fg)}
.sbtn.okc{background:rgba(46,204,113,.18);color:#2ecc71;border-color:#2f6b45}
.sbtn.badc{background:rgba(255,92,92,.18);color:#ff5c5c;border-color:#7c2b3c}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:0 3px;font:inherit;text-decoration:underline}
/* ===== 设置页 ===== */
.htop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;
padding:6px 12px;font-size:13px;min-height:32px;cursor:pointer;flex:none}
.sheetmask{position:fixed;inset:0;z-index:60;display:none;padding:18px;
background:rgba(0,0,0,.68);overflow:auto}
.sheetmask.show{display:block}
.panel{max-width:600px;margin:0 auto;background:var(--card);border:1px solid var(--line);
border-radius:14px;padding:18px}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.phead h2{margin:0;font-size:17px}
.sect{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sect h3{margin:0 0 10px;font-size:12px;letter-spacing:.05em;color:var(--mut);font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
border:1px solid var(--line);background:#141b28;border-radius:9px;
padding:10px 12px;margin-bottom:8px;font-size:14px}
label.setrow{cursor:pointer;user-select:none}
.setrow .rl{display:flex;flex-direction:column;gap:1px;min-width:0}
.setrow .rd{font-size:12px;color:var(--mut);line-height:1.4}
.setrow .sw{position:relative;flex:none;width:44px;height:24px;border-radius:999px;
background:#2a3446;border:1px solid var(--line);transition:background .18s,border-color .18s}
.setrow .sw input{position:absolute;inset:0;width:100%;height:100%;min-width:0;margin:0;
padding:0;opacity:0;cursor:pointer}
.setrow .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
background:#8b9bb4;pointer-events:none;transition:transform .18s,background .18s}
.setrow.on .sw{background:var(--blue);border-color:var(--blue)}
.setrow.on .sw i{transform:translateX(20px);background:#fff}
.setrow .sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:3px}
.setrow.stack{flex-direction:column;align-items:stretch;gap:8px}
.setrow button{flex:none}
.sect input[type=text],.sect input[type=password]{width:100%;min-width:0;flex:none}
.sect .act{margin-top:14px}
.smsg{min-height:17px;margin-top:9px;font-size:12px;color:var(--mut)}
.smsg.err{color:var(--red)}
.smsg.okc{color:var(--green)}
/* ===== 三页滑动 ===== */
.paneswrap{position:relative;overflow:hidden;touch-action:pan-y;transition:height .3s ease}
.panes{display:flex;align-items:flex-start;will-change:transform}
.pane{flex:0 0 100%;min-width:100%;box-sizing:border-box;padding-bottom:26px}
.plist{position:relative}
.pact{display:none;flex:none;background:var(--card);border:1px solid var(--line);
color:var(--fg);border-radius:8px;min-height:32px;padding:5px 12px;font-size:13px;cursor:pointer}
.pact.show{display:inline-flex;align-items:center}
.pact.on{border-color:var(--blue);color:#9fc0ff;background:rgba(76,141,255,.18)}
.pact:disabled{opacity:.35;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.segb{border:0;border-radius:0;background:var(--card);color:var(--mut);
min-height:32px;padding:5px 12px;font-size:13px}
.segb+.segb{border-left:1px solid var(--line)}
.segb.on{background:rgba(76,141,255,.18);color:#9fc0ff}
.arrowbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:6;display:none;
width:44px;height:76px;padding:0;border-radius:12px;font-size:22px;line-height:1;
background:rgba(26,33,48,.92);border:1px solid var(--line);color:var(--fg);cursor:pointer}
.arrowbtn.show{display:block}
.arrowbtn.l{left:calc(25% - 252px)}
.arrowbtn.r{right:calc(25% - 252px)}
.ibtn.pending{border-color:var(--blue);color:var(--blue);position:relative;overflow:hidden}
.ibtn.pending::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;
background:var(--blue);transform-origin:left;animation:revealbar 3s linear forwards}
.card.moving{position:relative}
.card.moving::after{content:'';position:absolute;left:10px;right:10px;bottom:4px;height:2px;
background:var(--blue);transform-origin:left;animation:revealbar 3s linear forwards;border-radius:2px}
@keyframes revealbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:720px){
header{padding:8px 12px;position:static}
.htop{gap:8px;align-items:center}
h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 span{display:none}
.iconbtn{padding:4px 10px;font-size:12px;min-height:28px}
.progresswrap{height:4px;margin:6px 0 4px}
.stats{font-size:11px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{gap:6px;margin-top:6px}
.bar select{flex:1 1 0;min-width:0;height:32px;padding:4px 6px;font-size:12px}
.bar #kw{display:none}
.bar.searching #kw{display:block;flex:1 1 100%;order:4;min-width:0;height:32px;padding:4px 8px;font-size:12px}
.bar .kwbtn{display:block;order:3;flex:0 0 auto;min-height:32px;padding:4px 8px;font-size:12px}
.bar.searching .kwbtn{background:var(--card);border:1px solid var(--blue);color:var(--blue)}
.segb{min-height:32px;padding:4px 10px;font-size:12px}
.arrowbtn{display:none!important}
.pact{min-height:32px;padding:4px 10px;font-size:12px}
.bar #starttest{flex:0 0 auto;min-height:32px;padding:4px 10px;font-size:12px}
main{padding:10px}
.testbar{gap:6px;margin-top:6px;padding-top:6px;font-size:12px}
.testbar span{flex:1 1 100%}
.testbar button{flex:0 1 auto;min-height:30px;padding:3px 8px;font-size:12px}
.card{padding:13px}
.opt{padding:11px 12px;min-height:44px}
.badge{min-width:30px;height:30px;border-radius:8px;font-size:13px}
.ibtn{width:30px;height:30px;border-radius:8px}
.ibtn svg{width:16px;height:16px}
.sbtn{width:40px;height:40px}
.sheetmask{padding:0}
.panel{border-radius:0;min-height:100%;max-width:none;border:0;padding:16px}
}
</style>
</head>
<body>
<header>
<div class="htop">
<h1>C语言400道选择题 刷题 <span>· 共 378 题</span></h1>
<button class="iconbtn" id="setbtn">设置</button>
</div>
<div class="progresswrap"><div class="pbar" id="pbar"></div></div>
<div class="stats" id="stats"></div>
<div class="bar">
<span class="seg" id="segord"><button class="segb" id="ordseq" data-ord="all">顺序</button><button class="segb" id="ordshuf" data-ord="shuffle">随机</button></span>
<button class="pact" id="okredo" title="把这些题移回「未做的题」，重新做一遍">移回未做</button>
<button class="pact" id="badredo" title="隐藏上次选择与答案，重新作答；答对后自动移出">重做</button>
<input id="kw" placeholder="搜索题干 / 答案关键词…"><button class="ghost kwbtn" id="kwbtn">搜索</button>
<select id="tn"><option value="10">抽 10 题</option><option value="20">抽 20 题</option>
<option value="30">抽 30 题</option><option value="50">抽 50 题</option></select>
<button id="starttest">开始模拟测试</button>
</div>
<div class="testbar" id="testbar"></div>
</header>
<main>
<div id="result"></div><div id="sheet"></div>
<div class="paneswrap" id="paneswrap">
<div class="panes" id="panes">
<div class="pane" data-pane="0"><div class="plist" id="pOk"></div></div>
<div class="pane" data-pane="1"><div class="plist" id="pTodo"></div></div>
<div class="pane" data-pane="2"><div class="plist" id="pBad"></div></div>
</div>
</div>
<div id="list"></div>
</main>
<button class="arrowbtn l" id="arrL" title="答对的题" aria-label="答对的题">‹</button>
<button class="arrowbtn r" id="arrR" title="做错的题" aria-label="做错的题">›</button>
<div class="sheetmask" id="settingsmask">
<div class="panel">
<div class="phead"><h2>设置</h2><button class="iconbtn" id="setclose">关闭</button></div>
<div class="sect">
<h3>答题</h3>
<label class="setrow" id="swunit"><span class="rl"><span>单题模式</span><span class="rd">一次只展开一题，答完自动跳到下一题</span></span><span class="sw"><input type="checkbox" id="unit"><i></i></span></label>
<label class="setrow" id="swauto"><span class="rl"><span>答对自动收起</span><span class="rd">答对后收起该题并跳下一题</span></span><span class="sw"><input type="checkbox" id="auto"><i></i></span></label>
<label class="setrow" id="swshuf"><span class="rl"><span>选项乱序</span><span class="rd">每次开启重新打乱 A/B/C/D</span></span><span class="sw"><input type="checkbox" id="shuf"><i></i></span></label>
</div>
<div class="sect">
<h3>数据</h3>
<div class="setrow"><span class="rl"><span>错题本</span><span class="rd">答错或直接看答案的题会自动收录</span></span><button class="ghost" id="clearlib">清空</button></div>
<div class="setrow"><span class="rl"><span>作答进度</span><span class="rd">清除所有已选答案与错题记录</span></span><button class="ghost" id="clearprog">清除</button></div>
<div class="setrow"><span class="rl"><span>筛选条件</span><span class="rd">恢复默认顺序并清空搜索关键词</span></span><button class="ghost" id="reset">重置</button></div>
</div>
<div class="sect" id="syncsect">
<h3>GitHub 云同步</h3>
<div class="setrow stack">
<label class="rl" for="stoken">GitHub 访问令牌</label>
<input id="stoken" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
</div>
<div class="smsg" id="smsg"></div>
<div class="act"><button class="ghost" id="sdel">清除令牌</button><button id="sok">保存并同步</button></div>
</div>
</div>

误:int *p,x; 正确:int *(p),*(x);D、错误:*p=x; 正确:p=&x;"},{"source":"400道题目.doc","num":294,"type":"选择题","stem":"根据下面的定义，能打印出字母M的语句是____","options":{"A":"printf(\"%c\\n\",class[3]、name);","D":"printf(\"%c\\n\",class[2]、name[0]);","B":"printf(\"%c\\n\",class[3]、name[1]);","C":"printf(\"%c\\n\",class[2]、name[1]); struct person { char name[9]; int age;}; struct person class[10]={\"John\",17, \"Paul\",19, \"Mary\",18, \"Adam\",16};"},"answer":"D","group":"3","raw":"根据下面的定义，能打印出字母M的语句是____ A) printf(\"%c\\n\",class[3]、name); D) printf(\"%c\\n\",class[2]、name[0]); B) printf(\"%c\\n\",class[3]、name[1]); C) printf(\"%c\\n\",class[2]、name[1]); struct person { char name[9]; int age;}; struct person class[10]={\"John\",17, \"Paul\",19, \"Mary\",18, \"Adam\",16};"},{"source":"400道题目.doc","num":295,"type":"选择题","stem":"假定建立了以下链表结构，指针p、q分别指向如图所示的结点，则以下可以将q所指结点从链表中删除并释放该结点的语句组是","options":{"A":"free(q); p->next=q->next;","B":"(*p)、next=(*q)、next; free(q);","C":"q=(*q)、next; (*p)、next=q; free(q);","D":"q=q->next; p->next=q; p=p->next; free(p);"},"answer":"B","group":"3","raw":"假定建立了以下链表结构，指针p、q分别指向如图所示的结点，则以下可以将q所指结点从链表中删除并释放该结点的语句组是 A) free(q); p->next=q->next; B) (*p)、next=(*q)、next; free(q); C) q=(*q)、next; (*p)、next=q; free(q); D) q=q->next; p->next=q; p=p->next; free(p);"},{"source":"400道题目.doc","num":296,"type":"选择题","stem":"假定下列程序的可执行文件名为prg、exe,则在该程序所在的子目录下输入命令行: prg hello good后,程序的输出结果是","options":{"A":"hello good","B":"hg","C":"hel","D":"hellogood main()(int argc, char *argv[]) { int i; if(argc<-0)return; for(i=1;i"},"answer":"B","group":"3","raw":"假定下列程序的可执行文件名为prg、exe,则在该程序所在的子目录下输入命令行: prg hello good后,程序的输出结果是 A) hello good B) hg C) hel D) hellogood main()(int argc, char *argv[]) { int i; if(argc<-0)return; for(i=1;i"},{"source":"400道题目.doc","num":297,"type":"选择题","stem":"假定以下程序经编译和连接后生成可执行文件PROG、EXE，如果在此可执行文件所在目录的DOS提示符下键入： PROG ABCDEFGH IJKL，则输出结果为","options":{"A":"ABCDEFG","B":"IJHL","C":"ABCDEFGHIJKL","D":"IJKLABCDEFGH main( int argc, char *argv[])) { while(--argc>0) print <script>

const STORE='cquiz400sel:state_v2';

barEl=document.getElementById('pbar'),testbarEl=document.getElementById('testbar'),
resultEl=document.getElementById('result'),sheetEl=document.getElementById('sheet');
let state={ans:{},mode:'all',kw:'',scroll:0,test:null,result:null,
unit:false,uidx:0,auto:false,shuf:false,shufSeed:0,updatedAt:0,redo:false,redoTs:0};
try{const s=JSON.parse(localStorage.getItem(STORE)||'{}');
if(s&&typeof s==='object'){state.ans=s.ans||{};
state.mode=(s.mode==='shuffle')?'shuffle':'all';
state.kw=s.kw||'';state.scroll=s.scroll||0;
state.unit=!!s.unit;state.uidx=s.uidx||0;state.auto=!!s.auto;state.shuf=!!s.shuf;state.shufSeed=s.shufSeed||0;state.updatedAt=+s.updatedAt||0;

function save(){state.updatedAt=Date.now();localStorage.setItem(STORE,JSON.stringify({ans:state.ans,mode:state.mode,kw:state.kw,

redo:state.redo,redoTs:state.redoTs}));noteChange();}
function qs(id){return document.getElementById(id)}
function syncSw(){['unit','auto','shuf'].forEach(k=>{const e=qs(k);const r=e&&e.closest('.setrow');if(r)r.classList.toggle('on',e.checked);});}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function hasOpts(r){return ['A','B','C','D'].filter(k=>r.options&&r.options[k])}
function entry(n){return state.ans[n]||null}
function gradedTest(){return !!(state.test&&state.test.phase==='done')}
function inLib(n){const e=entry(n);return !!(e&&(e.lib===true||(e.lib===undefined&&e.check==='bad')))}
function paneMode(){return !state.test&&!state.unit}
function redoActive(){return state.redo&&paneMode()}
function redoFresh(n){if(!redoActive())return false;const e=entry(n);
if(!e||e.check!=='bad')return false;
return !(e.rdAt&&e.rdAt>=(state.redoTs||0))}

function seedRand(seed){let s=(seed*2654435761)>>>0;
return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;}}
const _ord={};
function order(r){const keys=hasOpts(r);if(keys.length<2)return keys;
const ck=r.num+'_'+state.shuf+'_'+(state.shufSeed||0);if(_ord[ck])return _ord[ck];
let o=keys.slice();
if(state.shuf){const rnd=seedRand(r.num+((state.shufSeed||0)%3000000));
for(let i=o.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=o[i];o[i]=o[j];o[j]=t;}}
_ord[ck]=o;return o;}

const CODE_RE=/(#\s*include|#\s*define|\bmain\s*\(|printf\s*\(|scanf\s*\(|\bfor\s*\(|\bwhile\s*\(|\bswitch\s*\(|[;{}])/;
const CODESTART=/(#\s*include|#\s*define|main\s*\(|void\s+\w+\s*\(|int\s+\w+\s*\(|char\s+\w*\s*\(|float\s+\w+\s*\(|double\s+\w+\s*\(|struct\s+\w+\s*\{)/;
function looksCode(l){return CODE_RE.test(l)&&!/[：。？]\s*$/.test(l.trim())}
function fmt(s){s=s||'';
if(!CODE_RE.test(s))return '<span class="q">'+esc(s).replace(/\n/g,'<br>')+'</span>';
const lines=s.split('\n');
if(lines.length>1){let out='',i=0;
while(i<lines.length){
if(looksCode(lines[i])){const b=[];while(i<lines.length&&looksCode(lines[i])){b.push(lines[i]);i++;}
out+='<pre class="code">'+esc(b.join('\n'))+'</pre>';}
else{out+='<span class="q">'+esc(lines[i])+'</span><br>';i++;}}
return out;}
const m=CODESTART.exec(s);
if(m&&m.index>0)return '<span class="q">'+esc(s.slice(0,m.index))+'</span><pre class="code">'+esc(s.slice(m.index))+'</pre>';
if(/[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(s))return '<span class="q">'+esc(s).replace(/\n/g,'<br>')+'</span>';
return '<pre class="code">'+esc(s)+'</pre>';}

function setControls(d){['kw','tn','starttest','clearlib','clearprog','reset','unit','auto','shuf','ordseq','ordshuf'].forEach(id=>{const el=qs(id);if(el)el.disabled=d;});}
function pool(){let a=DATA.slice();
const kw=(qs('kw').value||'').trim().toLowerCase();
if(kw)a=a.filter(r=>(r.stem+r.answer).toLowerCase().includes(kw));
return a;}
let cache={key:null,nums:[]};
function ordered(a){const key=state.mode+'|'+(qs('kw').value||'');
if(cache.key!==key){cache.key=key;cache.nums=a.map(r=>r.num);
if(state.mode==='shuffle')cache.nums.sort(()=>Math.random()-0.5);}
else{const set=new Set(a.map(r=>r.num));
cache.nums=cache.nums.filter(n=>set.has(n));
a.forEach(r=>{if(cache.nums.indexOf(r.num)<0)cache.nums.push(r.num)});}
return cache.nums.map(n=>byNum[n]);}

function updateStats(shown){
const total=DATA.length;
const answered=DATA.filter(r=>{const e=entry(r.num);return !!(e&&(e.chosen!==undefined||e.check));}).length;
const graded=DATA.filter(r=>r.answer&&entry(r.num)&&(entry(r.num).chosen!==undefined||entry(r.num).check)).length;
const correct=DATA.filter(r=>r.answer&&entry(r.num)&&entry(r.num).check==='ok').length;
const acc=graded?Math.round(correct/graded*100):0;
const lib=DATA.filter(r=>inLib(r.num)).length;
barEl.style.width=(answered/total*100)+'%';
if(state.test&&state.test.phase==='run'){
statsEl.textContent='模拟测试中：第 '+(state.test.i+1)+' / '+state.test.ids.length+
' 题　·　本卷已作答 '+Object.keys(state.test.answers).filter(n=>state.test.answers[n]!=null).length+' 题';}
else if(paneMode()){const L=paneLists();
if(pageIdx===0)statsEl.textContent='答对的题　·　'+L.ok.length+' 题　·　已答 '+graded+
' 题　·　正确率 '+acc+'%';
else if(pageIdx===2)statsEl.textContent='做错的题　·　'+L.bad.length+' 题　·　已答 '+graded+
' 题'+(redoActive()?'　·　重做模式':'');
else statsEl.textContent='未做的题　·　'+L.todo.length+' 题　·　共 '+total+
' 题'+(shown!=null?'　·　显示 '+shown+' 题':'');}
else{statsEl.textContent='共 '+total+' 题　·　已答 '+answered+' 题　·　正确率 '+acc+
'%　·　错题 '+lib+' 题'+(shown!=null?'　·　显示 '+shown+' 题':'');}}

function statusBadge(r,testMode){const ord=order(r);
if(testMode){if(gradedTest()&&r.answer){const a2=state.test.answers[r.num];
if(a2==null)return '<span class="bad">✗ 未作答</span>';
return a2===r.answer?'':'<span class="bad">✗ 错题</span>';}
const m=state.test.answers[r.num];
if(m&&hasOpts(r).length)return '<span class="sel">已选 '+'ABCD'[ord.indexOf(m)]+'</span>';
return '';}
if(redoFresh(r.num))return '';
const e=entry(r.num);if(!e)return '';
if(!e.check)return e.chosen!==undefined?'<span class="sel">已选 '+'ABCD'[ord.indexOf(e.chosen)]+'</span>':'';
return e.check==='ok'?'':'<span class="bad">✗ 错题</span>';}

function cardInner(r,testMode){
let e=entry(r.num)||{};if(redoFresh(r.num))e={};const keys=hasOpts(r);const ord=order(r);
const dmap={};ord.forEach((k,i)=>dmap[k]='ABCD'[i]);
const collapsed=!testMode&&e.collapse===true&&e.check==='ok';
let optsHtml='';
if(keys.length&&!collapsed){
optsHtml='<div class="opts">'+ord.map((k,i)=>{const L='ABCD'[i];let cls='opt';
if(testMode){const a2=state.test.answers[r.num];
if(gradedTest()&&r.answer){if(k===r.answer)cls+=' correct';else if(a2===k)cls+=' wrong';}
else if(a2===k)cls+=' sel';}
else if(e.check){if(k===r.answer)cls+=' correct';else if(e.chosen===k)cls+=' wrong';}
else if(e.chosen===k)cls+=' sel';
return '<div class="'+cls+'" data-opt="'+k+'"><span class="k">'+L+'</span><span>'+esc(r.options[k])+'</span></div>';
}).join('')+'</div>';}
const showAns=!collapsed&&(testMode?!!e.revealed:(!!e.check||!!e.revealed));
const shown=r.answer?(dmap[r.answer]||r.answer):'';
const ansInner=keys.length
?('<b>答案：</b><b class="ansL">'+shown+'</b>'+(state.shuf&&r.answer&&shown!==r.answer?'<span class="mut">（原'+r.answer+'）</span>':''))
:('<b>答案：</b>'+fmt(r.answer));
const ansHtml='<div class="ans'+(showAns?' show':'')+'">'+ansInner+'</div>';
const eyeIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const starIco='<svg viewBox="0 0 24 24" fill="'+(inLib(r.num)?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.3 5.8 21 7.2 14 2 9.3 8.9 8.6"/></svg>';
let ico='<button class="ibtn'+(showAns?' on':'')+(revealNum===r.num?' pending':'')+'" data-rev="1" title="显示 / 隐藏答案" aria-label="显示或隐藏答案">'+eyeIco+'</button>';
if(!testMode){ico+='<button class="ibtn'+(inLib(r.num)?' on':'')+'" data-lib="1" title="'+(inLib(r.num)?'移出错题本':'加入错题本')+'" aria-label="加入或移出错题本">'+starIco+'</button>';}
const act='<span class="icog">'+ico+'</span>';
return '<div class="tags"><span class="badge">'+r.num+'</span>'+statusBadge(r,testMode)+
(collapsed?'<span class="mut">已收起 · 点卡片展开</span>':'')+act+'</div>'+
'<div class="stem">'+(collapsed?'<span class="q">'+esc((r.stem||'').split('\n')[0])+'</span>':fmt(r.stem))+'</div>'+
optsHtml+ansHtml;}

let _scrollTo=null;
function renderList(){
const a=ordered(pool());window.__cur=a;
if(state.unit&&!state.test){
if(!a.length){testbarEl.style.display='none';listEl.innerHTML='<div class="empty">没有匹配的题目</div>';updateStats(0);return;}
state.uidx=Math.max(0,Math.min(state.uidx,a.length-1));
testbarEl.style.display='flex';
testbarEl.innerHTML='<span>单题模式　第 '+(state.uidx+1)+' / '+a.length+' 题</span>'+
'<button class="ghost" data-nav="u-first">首题</button>'+
'<button class="ghost" data-nav="u-prev" '+(state.uidx===0?'disabled':'')+'>上一题</button>'+
'<button class="ghost" data-nav="u-next" '+(state.uidx===a.length-1?'disabled':'')+'>下一题</button>';
const r=a[state.uidx];listEl.innerHTML='';
const d=document.createElement('div');d.className='card';d.dataset.q=r.num;
d.innerHTML=cardInner(r,false);listEl.appendChild(d);updateStats(a.length);return;}
testbarEl.style.display='none';
listEl.innerHTML='';
fillPanes();updateStats(state.unit?a.length:null);
applyPane(false);updateArrows();sizeWrap();
if(_scrollTo!=null){const t=document.querySelector('.card[data-q="'+_scrollTo+'"]');_scrollTo=null;
if(t)t.scrollIntoView({behavior:'smooth',block:'center'});}}

/* ===== 三页滑动 ===== */
let pageIdx=1,dragX=0,dragging=false,tX=0,tY=0,revealTimer=null,revealNum=null;
function paneEls(){return [qs('pOk'),qs('pTodo'),qs('pBad')]}
function paneW(){const w=qs('paneswrap');return w?w.clientWidth:0}
function sizeWrap(){const w=qs('paneswrap'),p=paneEls()[pageIdx];
if(!w||!p)return;const pane=p.closest('.pane');
w.style.height=(pane||p).offsetHeight+'px';}
function applyPane(anim){const el=qs('panes');
el.style.transition=anim===false?'none':'';
el.style.transform='translateX('+(-pageIdx*paneW()+dragX)+'px)';}
function goPane(i){i=Math.max(0,Math.min(2,i));dragX=0;pageIdx=i;applyPane(true);
updateArrows();updatePageTools();updateStats();requestAnimationFrame(sizeWrap);}
/* 工具栏按钮随当前页切换：对页=移回未做，未做页=顺序/随机，错页=重做 */
function updatePageTools(){const okb=qs('okredo'),badb=qs('badredo'),seg=qs('segord');
if(!okb||!badb)return;
const pane=paneMode(),onOk=pane&&pageIdx===0,onBad=pane&&pageIdx===2;
okb.classList.toggle('show',onOk);badb.classList.toggle('show',onBad);
if(seg)seg.style.display=(pane&&pageIdx!==1)?'none':'';
okb.disabled=!paneLists().ok.length;
badb.classList.toggle('on',!!state.redo);
badb.textContent=state.redo?'重做中':'重做';}
function updateArrows(){const on=window.innerWidth>=1060&&paneMode();
const l=qs('arrL'),r=qs('arrR');
const canL=on&&pageIdx>0,canR=on&&pageIdx<2;
l.classList.toggle('show',canL);r.classList.toggle('show',canR);
l.disabled=!canL;r.disabled=!canR;}
function paneLists(){const base=ordered(pool());const ok=[],todo=[],bad=[];
base.forEach(r=>{const e=entry(r.num);
if(e&&e.check==='ok')ok.push(r);
else if(e&&e.check==='bad')bad.push(r);
else todo.push(r);});
return {ok:ok,todo:todo,bad:bad};}
function setPane(i,arr,tip){const el=paneEls()[i];if(!el)return;
if(!arr.length){el.innerHTML='<div class="empty">'+tip+'</div>';return;}
if(state.test&&state.test.phase==='done'&&i!==1)el.innerHTML=arr.map(r=>'<div class="card" data-q="'+r.num+'">'+cardInner(r,true)+'</div>').join('');
else el.innerHTML=arr.map(r=>'<div class="card" data-q="'+r.num+'">'+cardInner(r,false)+'</div>').join('');}
function fillPanes(){const L=paneLists();
const graded=state.test&&state.test.phase==='done';
setPane(0,L.ok,graded?'本次没有答对的题':'还没有答对的题');
setPane(1,graded?[]:L.todo,'没有匹配的题目');
setPane(2,L.bad,graded?'本次没有答错或未作答的题':(redoActive()?'没有待重做的错题':'还没有做错的题'));
updatePageTools();}
function clearRevealUI(){document.querySelectorAll('.ibtn.pending').forEach(b=>b.classList.remove('pending'));
document.querySelectorAll('.card.moving').forEach(c=>c.classList.remove('moving'));}
function flyAway(card,dir,cb){const list=card.parentNode;
const lr=list.getBoundingClientRect(),cr=card.getBoundingClientRect();
const others=[].slice.call(list.children).filter(c=>c!==card&&c.classList.contains('card'));
const tops=others.map(c=>c.getBoundingClientRect().top);
card.style.position='absolute';card.style.margin='0';card.style.zIndex='5';
card.style.left=(cr.left-lr.left)+'px';card.style.top=(cr.top-lr.top)+'px';
card.style.width=cr.width+'px';card.style.pointerEvents='none';
others.forEach((c,i)=>{const dy=tops[i]-c.getBoundingClientRect().top;
if(Math.abs(dy)<1)return;c.style.transition='none';c.style.transform='translateY('+dy+'px)';});
requestAnimationFrame(()=>{
others.forEach(c=>{c.style.transition='transform .3s cubic-bezier(.4,0,.2,1)';c.style.transform='';});
const W=paneW()||window.innerWidth;
const dist=dir>0?(W-cr.left+24):-(cr.left+cr.width+24);
card.style.transition='transform .36s cubic-bezier(.4,0,.2,1),opacity .36s';
card.style.transform='translateX('+dist+'px)';card.style.opacity='0';});
setTimeout(()=>{card.remove();others.forEach(c=>{c.style.transition='';c.style.transform='';});
if(cb)cb();},360);}
function settle(num,r,card,en){
const target=en.check==='ok'?0:(en.check==='bad'?2:1);
const pane=card&&card.parentNode?card.closest('.pane'):null;
const cur=pane?+pane.dataset.pane:-1;
if(cur===target){if(card)card.innerHTML=cardInner(r,false);fillCounts();updateStats();requestAnimationFrame(sizeWrap);return;}
if(cur>=0&&card)flyAway(card,target<cur?-1:1,afterMove);
else afterMove();
function afterMove(){fillPanes();sizeWrap();updateStats();}}
function fillCounts(){updatePageTools();}
function stopReveal(){clearTimeout(revealTimer);revealTimer=null;revealNum=null;clearRevealUI();}
/* 立即显示答案，3 秒后自动移入「做错的题」 */
function revealNow(n){const r=byNum[n];if(!r)return;
const en=entry(n)||{};
en.revealed=true;
if(redoActive())en.rdAt=Date.now();
if(!en.check){en.check='bad';en.lib=true;en.rv=1;}
state.ans[n]=en;save();
stopReveal();revealNum=n;
const card=document.querySelector('.card[data-q="'+n+'"]');
if(card){card.innerHTML=cardInner(r,false);card.classList.add('moving');
const b=card.querySelector('[data-rev]');if(b)b.classList.add('pending');
requestAnimationFrame(sizeWrap);}
revealTimer=setTimeout(()=>{revealTimer=null;clearRevealUI();revealNum=null;
const c2=document.querySelector('.card[data-q="'+n+'"]');
if(c2)c2.classList.remove('moving');
settle(n,r,c2,entry(n));},3000);}
/* 取消待移入的 3 秒计时（答题或再点眼睛时调用），不改数据 */
function cancelReveal(n){if(revealNum!==n)return;stopReveal();}
/* 点眼睛取消：收回刚揭晓的答案与错题标记 */
function undoReveal(n){stopReveal();const en=entry(n);if(!en)return;
if(en.rv){en.revealed=false;en.check='';en.lib=false;if(en.chosen===undefined)delete en.chosen;delete en.rv;}
else en.revealed=false;
save();render();}

function sheetHtml(){const tb=state.test;if(!tb)return '';
const done=Object.keys(tb.answers).filter(n=>tb.answers[n]!=null).length;
const graded=tb.phase==='done';
return '<div class="card sheet"><div class="shead">答题卡　·　共 '+tb.ids.length+' 题　·　已答 '+done+' 题'+
(graded?'　·　答对 '+tb.ids.filter(n=>tb.answers[n]===byNum[n].answer).length+' 题':'')+'</div>'+
'<div class="sgrid">'+tb.ids.map((n,i)=>{let cls='sbtn';const a=tb.answers[n];
if(graded)cls+=(a===byNum[n].answer?' okc':' badc');
else if(a!=null)cls+=' done';
if(i===tb.i&&!graded)cls+=' cur';
return '<button class="'+cls+'" data-sheet="'+i+'">'+(i+1)+'</button>';}).join('')+'</div></div>';}

function renderTest(){const tb=state.test,r=byNum[tb.ids[tb.i]];
qs('paneswrap').style.display='none';updateArrows();updatePageTools();
testbarEl.style.display='flex';
testbarEl.innerHTML='<span>模拟测试 第 '+(tb.i+1)+' / '+tb.ids.length+' 题</span>'+
'<button class="ghost" data-nav="prev" '+(tb.i===0?'disabled':'')+'>上一题</button>'+
'<button class="ghost" data-nav="next" '+(tb.i===tb.ids.length-1?'disabled':'')+'>下一题</button>'+
'<button data-nav="submit">交卷评分</button>';
resultEl.innerHTML='';sheetEl.innerHTML=sheetHtml();
listEl.innerHTML='';
const d=document.createElement('div');d.className='card';d.dataset.q=r.num;
d.innerHTML=cardInner(r,true);listEl.appendChild(d);updateStats(null);window.scrollTo(0,0);}

function resultHtml(res){return '<div class="card result"><h3 style="margin:0">模拟测试结果</h3>'+
'<div class="big">'+res.correct+' / '+res.n+'　正确率 '+res.acc+'%</div>'+
'<div class="mut">错题：'+(res.wrong.length?res.wrong.map(n=>'<button class="lnk" data-goto="'+n+'">#'+n+'</button>').join(' '):'无')+'</div>'+
'<div class="act"><button data-res="wrong">查看错题</button><button class="ghost" data-res="close">关闭</button></div></div>';}

function render(){
if(state.test&&state.test.phase==='run'){renderTest();return;}
testbarEl.style.display='none';
sheetEl.innerHTML=state.test?sheetHtml():'';
resultEl.innerHTML=state.result?resultHtml(state.result):'';
if(state.unit&&!state.test){qs('paneswrap').style.display='none';qs('list').style.display='';
renderList();updateArrows();updatePageTools();return;}
qs('paneswrap').style.display='';qs('list').style.display='none';
renderList();}

function startTest(){
const n=+qs('tn').value;
let p=DATA.filter(r=>r.answer&&hasOpts(r).length);
if(!p.length){alert('本页题目没有选项，无法进行模拟测试。');return;}
p.sort(()=>Math.random()-0.5);
const ids=p.slice(0,Math.min(n,p.length)).map(r=>r.num);
state.test={ids:ids,i:0,answers:{},phase:'run'};
state.result=null;state.unit=false;qs('unit').checked=false;syncSw();setControls(true);save();render();window.scrollTo(0,0);}

function submitTest(){const tb=state.test;let correct=0;const wrong=[];
tb.ids.forEach(n=>{const r=byNum[n];const chosen=tb.answers[n]!=null?tb.answers[n]:null;
const ok=chosen===r.answer;
state.ans[n]=state.ans[n]||{};
state.ans[n].chosen=chosen;state.ans[n].check=ok?'ok':'bad';state.ans[n].revealed=true;state.ans[n].lib=!ok;
if(ok)correct++;else wrong.push(n);});
save();tb.phase='done';
state.result={n:tb.ids.length,correct:correct,acc:Math.round(correct/tb.ids.length*100),wrong:wrong};
setControls(false);render();}

function endTest(){state.test=null;setControls(false);save();render();}

function autoAdvance(num){const a=window.__cur||[];const i=a.findIndex(r=>r.num===num);if(i<0)return;
if(state.unit){if(i<a.length-1)state.uidx=i+1;}
else{if(i<a.length-1)_scrollTo=a[i+1].num;}}

function jumpTo(n){
if(state.unit){const a0=ordered(pool());const i0=a0.findIndex(r=>r.num===n);if(i0>=0)state.uidx=i0;}
render();
const t=document.querySelector('.card[data-q="'+n+'"]');
if(t){t.scrollIntoView({behavior:'smooth',block:'center'});
t.style.transition='box-shadow .4s';t.style.boxShadow='0 0 0 2px var(--blue)';
setTimeout(()=>{t.style.boxShadow='';},1600);}}

document.addEventListener('click',e=>{
const nav=e.target.closest('[data-nav]');
if(nav){const a=nav.dataset.nav;
if(state.test&&state.test.phase==='run'){
if(a==='prev'){state.test.i=Math.max(0,state.test.i-1);renderTest();}
else if(a==='next'){state.test.i=Math.min(state.test.ids.length-1,state.test.i+1);renderTest();}
else if(a==='submit'){if(confirm('确定交卷评分？未作答的题会记为错题。'))submitTest();}
return;}
const A=window.__cur||[];
if(a==='u-first'){state.uidx=0;save();render();window.scrollTo({top:0,behavior:'smooth'});}
else if(a==='u-prev'){state.uidx=Math.max(0,state.uidx-1);save();render();window.scrollTo({top:0,behavior:'smooth'});}
else if(a==='u-next'){state.uidx=Math.min(A.length-1,state.uidx+1);save();render();window.scrollTo({top:0,behavior:'smooth'});}
return;}
const res=e.target.closest('[data-res]');
if(res){if(res.dataset.res==='wrong'){goPane(2);render();}
else if(res.dataset.res==='close'){state.result=null;state.test=null;setControls(false);save();render();}
return;}
const gt=e.target.closest('[data-goto]');
if(gt){goPane(2);jumpTo(+gt.dataset.goto);return;}
const sb=e.target.closest('[data-sheet]');
if(sb){if(state.test&&state.test.phase==='run'){state.test.i=+sb.dataset.sheet;renderTest();}return;}
const ordb=e.target.closest('[data-ord]');
if(ordb){state.mode=ordb.dataset.ord;cache.key=null;updateSeg();save();render();return;}
const card=e.target.closest('.card');if(!card)return;
const num=+card.dataset.q,r=byNum[num];if(!r)return;
const rev=e.target.closest('[data-rev]'),lib=e.target.closest('[data-lib]'),opt=e.target.closest('.opt');
const testRun=!!(state.test&&state.test.phase==='run');
if(rev){if(!testRun&&paneMode()){
if(revealTimer&&revealNum===num){undoReveal(num);return;}
const e0=entry(num)||{};
if(e0.revealed){e0.revealed=false;save();render();return;}
revealNow(num);return;}
const en=entry(num)||{};en.revealed=!en.revealed;
if(!testRun&&en.revealed){if(redoActive())en.rdAt=Date.now();
if(!en.check)en.check='bad';if(en.check==='bad')en.lib=true;}
state.ans[num]=en;save();render();return;}
if(lib){const en=entry(num)||{};
if(inLib(num)){en.lib=false;if(en.check==='bad')en.check='';}
else{en.lib=true;en.check='bad';}
if(en.rv)delete en.rv;
state.ans[num]=en;save();
if(paneMode()&&!testRun){cancelReveal(num);settle(num,r,card,en);return;}
render();return;}
if(opt){const k=opt.dataset.opt;
if(testRun){state.test.answers[num]=(state.test.answers[num]===k?null:k);renderTest();return;}
const en=entry(num)||{};en.chosen=k;
if(redoActive())en.rdAt=Date.now();
if(r.answer){en.check=(k===r.answer?'ok':'bad');en.revealed=true;en.lib=en.check==='bad';}
if(!r.answer){state.ans[num]=en;save();render();return;}
if(paneMode()){
cancelReveal(num);const _e3=entry(num);if(_e3&&_e3.rv){delete _e3.rv;state.ans[num]=_e3;}
card.querySelectorAll('.opt').forEach(o=>{const ok2=o.dataset.opt;
if(ok2===r.answer)o.classList.add('correct');else if(ok2===k)o.classList.add('wrong');});
state.ans[num]=en;save();settle(num,r,card,en);return;}
if(state.auto&&en.check==='ok'){en.collapse=true;state.ans[num]=en;autoAdvance(num);}
else{state.ans[num]=en;}
save();render();return;}
const en=entry(num)||{};
if(en.collapse&&en.check==='ok'){en.collapse=false;state.ans[num]=en;save();render();}
});

function updateSeg(){const a=qs('ordseq'),b=qs('ordshuf');if(!a)return;
a.classList.toggle('on',state.mode!=='shuffle');b.classList.toggle('on',state.mode==='shuffle');}

qs('kw').value=state.kw;
qs('unit').checked=state.unit;qs('auto').checked=state.auto;qs('shuf').checked=state.shuf;syncSw();updateSeg();

qs('ordseq').addEventListener('click',()=>{state.mode='all';cache.key=null;updateSeg();save();render();});
qs('ordshuf').addEventListener('click',()=>{state.mode='shuffle';cache.key=null;updateSeg();save();render();});
qs('kw').addEventListener('input',()=>{state.kw=qs('kw').value;save();render();});
qs('unit').addEventListener('change',()=>{state.unit=qs('unit').checked;syncSw();save();window.scrollTo(0,0);render();});
qs('auto').addEventListener('change',()=>{state.auto=qs('auto').checked;syncSw();save();});
qs('shuf').addEventListener('change',()=>{state.shuf=qs('shuf').checked;if(state.shuf)state.shufSeed=Math.floor(Math.random()*1e9);syncSw();save();render();});
qs('badredo').addEventListener('click',()=>{state.redo=!state.redo;
if(state.redo)state.redoTs=Date.now();save();render();});
qs('okredo').addEventListener('click',()=>{let n=0;
DATA.forEach(r=>{const e=entry(r.num);if(e&&e.check==='ok'){
e.check='';e.chosen=undefined;e.revealed=false;e.collapse=false;e.lib=false;e.rdAt=undefined;n++;}});
if(!n)return;save();render();goPane(1);});
qs('starttest').addEventListener('click',startTest);
qs('clearlib').addEventListener('click',()=>{if(!confirm('确定清空错题本？'))return;
DATA.forEach(r=>{if(inLib(r.num)){state.ans[r.num].check='ok';state.ans[r.num].lib=false;}});save();render();});
qs('clearprog').addEventListener('click',()=>{if(!confirm('确定清除所有作答进度？'))return;
state.ans={};save();render();});
qs('reset').addEventListener('click',()=>{qs('kw').value='';state.kw='';state.mode='all';cache.key=null;
updateSeg();endTest();});
/* ===== 翻页：PC 箭头 + 手机滑动 ===== */
qs('arrL').addEventListener('click',()=>goPane(pageIdx-1));
qs('arrR').addEventListener('click',()=>goPane(pageIdx+1));
const _wrap=qs('paneswrap');
_wrap.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;
tX=e.touches[0].clientX;tY=e.touches[0].clientY;dragging=false;dragX=0;},{passive:true});
_wrap.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;
const dx=e.touches[0].clientX-tX,dy=e.touches[0].clientY-tY;
if(!dragging){if(Math.abs(dx)<14)return;
if(Math.abs(dx)<Math.abs(dy)*1.6)return;
dragging=true;}
dragX=dx;
if((pageIdx===0&&dragX>0)||(pageIdx===2&&dragX<0))dragX*=0.3;
applyPane(false);},{passive:true});
_wrap.addEventListener('touchend',()=>{if(!dragging){dragX=0;applyPane(true);return;}
const w=paneW(),th=Math.max(70,w*0.22);let i=pageIdx;
if(dragX<-th)i=pageIdx+1;else if(dragX>th)i=pageIdx-1;
dragging=false;goPane(i);});
_wrap.addEventListener('touchcancel',()=>{dragging=false;dragX=0;applyPane(true);});
window.addEventListener('resize',()=>{applyPane(false);updateArrows();sizeWrap();});
window.addEventListener('load',()=>{applyPane(false);updateArrows();sizeWrap();});
if(window.matchMedia){const mq=window.matchMedia('(min-width:1060px)');
if(mq.addEventListener)mq.addEventListener('change',updateArrows);}
/* ===== GitHub 云同步 ===== */
const SYNC_CFG='cquiz400sel:sync_cfg';
const SYNC_REPO='TKBW10/v6k1m8z3q9x4',SYNC_BRANCH='main',SYNC_PATH='state/progress.json';
let syncNoSave=false;
function syncCfg(){let token='';try{const c=JSON.parse(localStorage.getItem(SYNC_CFG)||'null');
if(c&&typeof c==='object'&&c.token)token=c.token;}catch(e){}
return {repo:SYNC_REPO,branch:SYNC_BRANCH,path:SYNC_PATH,token:token}}
function syncMsg(t,k){const el=qs('smsg');if(!el)return;el.textContent=t||'';el.className='smsg'+(k?' '+k:'');}
function b64enc(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i++)x+=String.fromCharCode(b[i]);return btoa(x)}
function b64dec(s){const bin=atob((s||'').replace(/\s/g,''));const b=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function snap(){return {ans:state.ans,mode:state.mode,kw:state.kw,scroll:window.scrollY,
unit:state.unit,uidx:state.uidx,auto:state.auto,shuf:state.shuf,shufSeed:state.shufSeed,updatedAt:state.updatedAt||0}}
function payload(){return {app:'c-language-400-quiz',v:2,updatedAt:state.updatedAt||0,state:snap()}}
async function gh(method,cfg,body){
const u='https://api.github.com/repos/'+cfg.repo+'/contents/'+cfg.path+(method==='GET'?'?ref='+encodeURIComponent(cfg.branch):'');
const r=await fetch(u,{method,headers:{'Accept':'application/vnd.github+json',
'Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
body:body?JSON.stringify(body):void 0});
let j=null;try{j=await r.json()}catch(e){}
return {status:r.status,ok:r.ok,json:j};}
function syncFail(r){const m=(r.json&&r.json.message)?'（'+r.json.message+'）':'';
if(r.status===401)alert('Token 无效或已过期。');
else if(r.status===403)alert('权限不足：请确认 Token 对该仓库具备 Contents 读写权限。'+m);
else if(r.status===404)alert('仓库或路径不存在；若仓库为私有，请检查 Token 权限。'+m);
else if(r.status===409)alert('云端文件刚被更新，请重试同步。'+m);
else alert('同步失败（HTTP '+r.status+'）'+m);
if(r.status===401||r.status===403||r.status===404)openSyncDlg();}
function syncPull(remote){
if(!remote||!remote.state||typeof remote.state!=='object'){alert('云端数据格式不正确，已中止。');return;}
const s=remote.state;s.updatedAt=+remote.updatedAt||0;
localStorage.setItem(STORE,JSON.stringify(s));syncNoSave=true;location.reload();}
async function syncPush(cfg,sha){
const r=await gh('PUT',cfg,{message:'sync: update quiz progress',
content:b64enc(JSON.stringify(payload(),null,2)),branch:cfg.branch,...(sha?{sha}:{})});
if(r.ok){autoBroken=false;pendingPush=false;lastStateSig=stateSig(state);alert('已把本地进度上传到仓库。');}else syncFail(r);}
async function doSync(){
const cfg=syncCfg();
if(!cfg.repo||!cfg.path||!cfg.token){openSyncDlg();return;}
const btn=qs('sok');btn.disabled=true;
try{
const g=await gh('GET',cfg);
if(g.status===404){
if(!confirm('云端还没有进度文件，创建并上传当前进度？'))return;
await syncPush(cfg,'');return;}
if(!g.ok){syncFail(g);return;}
let remote=null;try{remote=JSON.parse(b64dec(g.json.content))}catch(e){alert('云端文件无法解析为 JSON。');return;}
const lt=state.updatedAt||0,rt=+remote.updatedAt||0,fmt=t=>new Date(t).toLocaleString();
if(rt>lt){
if(confirm('云端进度较新（'+fmt(rt)+'）。\n\n用云端覆盖本地？\n【取消】则改为用本地覆盖云端')){syncPull(remote);return;}
if(confirm('确定用本地进度覆盖云端？'))await syncPush(cfg,g.json.sha);
return;}
if(lt>rt){
if(confirm('本地进度较新（'+fmt(lt)+'）。\n\n上传覆盖云端？\n【取消】则改为用云端覆盖本地')){await syncPush(cfg,g.json.sha);return;}
if(confirm('确定用云端进度覆盖本地？'))syncPull(remote);
return;}
alert('本地与云端一致，无需同步。');
}catch(e){alert('同步失败：'+(e&&e.message?e.message:e));}
finally{btn.disabled=false}}
/* ===== 自动同步 ===== */
const AUTO_DEBOUNCE=60000;
let pendingPush=false,pushTimer=null,pushBusy=false,pullBusy=false,autoBroken=false;
function stateSig(s){return JSON.stringify({ans:s.ans||{},mode:s.mode,unit:!!s.unit,auto:!!s.auto,shuf:!!s.shuf,shufSeed:s.shufSeed||0})}
let lastStateSig=stateSig(state);
function noteChange(){
const sig=stateSig(state);
if(sig===lastStateSig)return;
lastStateSig=sig;pendingPush=true;schedulePush();}
function schedulePush(){
clearTimeout(pushTimer);
if(!pendingPush||autoBroken||!syncCfg().token)return;
pushTimer=setTimeout(flushPush,AUTO_DEBOUNCE);}
function applyRemote(remote){
if(!remote||!remote.state)return false;
const s=remote.state;s.updatedAt=+remote.updatedAt||0;
localStorage.setItem(STORE,JSON.stringify(s));syncNoSave=true;location.reload();return true;}
async function pushSilent(cfg,sha,msg){
const r=await gh('PUT',cfg,{message:'sync: '+msg,content:b64enc(JSON.stringify(payload(),null,2)),branch:cfg.branch,...(sha?{sha}:{})});
if(r.ok){pendingPush=false;autoBroken=false;lastStateSig=stateSig(state);
syncMsg('已自动同步 '+new Date().toLocaleTimeString(),'okc');return true}
if(r.status===401||r.status===403){autoBroken=true;syncMsg('自动同步已暂停：令牌无效或无权限','err');return false}
if(r.status===409){clearTimeout(pushTimer);pushTimer=setTimeout(flushPush,5000)}
return false}
async function flushPush(){
clearTimeout(pushTimer);pushTimer=null;
const cfg=syncCfg();
if(!cfg.token||!pendingPush||pushBusy)return;
pushBusy=true;
try{
const g=await gh('GET',cfg);
if(g.status===404){await pushSilent(cfg,'','create progress');return}
if(!g.ok)return;
let remote=null;try{remote=JSON.parse(b64dec(g.json.content))}catch(e){return}
if((+remote.updatedAt||0)>(state.updatedAt||0)){applyRemote(remote);return}
if(!remote.state||stateSig(remote.state)!==stateSig(state)){await pushSilent(cfg,g.json.sha,'auto save progress')}
}catch(e){}finally{pushBusy=false}}
async function syncBoot(){
const cfg=syncCfg();if(!cfg.token||pullBusy)return;
pullBusy=true;
try{
const g=await gh('GET',cfg);
if(g.status===404){await pushSilent(cfg,'','create progress');return}
if(g.status===401||g.status===403){autoBroken=true;return}
if(!g.ok||!g.json||!g.json.content)return;
let remote=null;try{remote=JSON.parse(b64dec(g.json.content))}catch(e){return}
if(!remote.state||stateSig(remote.state)===stateSig(state))return;
if((+remote.updatedAt||0)>(state.updatedAt||0)){applyRemote(remote);return}
pendingPush=true;lastStateSig=stateSig(state);flushPush();
}catch(e){}finally{pullBusy=false}}
async function autoPull(){
const cfg=syncCfg();if(!cfg.token||pullBusy||autoBroken||pendingPush)return;
pullBusy=true;
try{
const g=await gh('GET',cfg);
if(!g.ok||!g.json||!g.json.content)return;
let remote=null;try{remote=JSON.parse(b64dec(g.json.content))}catch(e){return}
if(remote.state&&(+remote.updatedAt||0)>(state.updatedAt||0)&&stateSig(remote.state)!==stateSig(state))applyRemote(remote);
}catch(e){}finally{pullBusy=false}}
function openSyncDlg(){qs('stoken').value=syncCfg().token;syncMsg('');openSettings('syncsect');}
function openSettings(focusId){qs('settingsmask').classList.add('show');
if(focusId){const s=qs(focusId);if(s)setTimeout(()=>s.scrollIntoView({block:'center'}),0);}}
function closeSyncDlg(){qs('settingsmask').classList.remove('show')}
qs('setbtn').addEventListener('click',()=>openSettings());
qs('kwbtn').addEventListener('click',()=>{
if(qs('kw').parentNode.classList.toggle('searching'))qs('kw').focus();});
qs('setclose').addEventListener('click',closeSyncDlg);
qs('settingsmask').addEventListener('click',e=>{if(e.target===qs('settingsmask'))closeSyncDlg();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSyncDlg();});
qs('sok').addEventListener('click',()=>{
const token=qs('stoken').value.trim();
if(!token){syncMsg('请先填入 GitHub 访问令牌。','err');qs('stoken').focus();return;}
localStorage.setItem(SYNC_CFG,JSON.stringify({token}));doSync();});
qs('sdel').addEventListener('click',()=>{localStorage.removeItem(SYNC_CFG);qs('stoken').value='';
clearTimeout(pushTimer);pushTimer=null;pendingPush=false;
syncMsg('已清除本机保存的凭证。','okc');});
window.addEventListener('beforeunload',()=>{if(!syncNoSave)save();});
document.addEventListener('visibilitychange',()=>{
if(document.hidden){if(pendingPush)flushPush();}else autoPull();});
window.addEventListener('focus',()=>autoPull());
setTimeout(syncBoot,1500);
if(!DATA.some(r=>hasOpts(r).length)){['tn','starttest'].forEach(id=>{const el=qs(id);if(el)el.style.display='none';});}
render();
setTimeout(()=>window.scrollTo(0,state.scroll||0),30);
</script>
